{% extends "base.html" %}
{% block contenuto %}
<section class="pagina">
    <h1>Registrazione</h1>
    <form method="post" class="modulo">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Nome utente <input name="username" minlength="3" maxlength="50" required></label>
        <label>Password <input type="password" name="password" minlength="8" required></label>
        <button class="pulsante" type="submit">Registrati</button>
    </form>
    <p>Hai già un account? <a href="{{ url_for('auth.login') }}">Login</a></p>
</section>
{% endblock %}
