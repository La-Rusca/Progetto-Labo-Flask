{% extends "base.html" %}
{% block contenuto %}
<section class="intro">
    <p class="etichetta">GarageOS Mini</p>
    <h1>Gestione garage</h1>
    <p>Un sito per salvare le auto e segnare le spese.</p>
    <a class="pulsante" href="{{ url_for('veicoli') }}">Vai ai veicoli</a>
</section>
<section class="griglia">
    <article class="scheda">
        <span class="emoji">🚘</span>
        <h2>Veicoli</h2>
        <p class="numero">{{ veicoli }}</p>
    </article>
    <article class="scheda">
        <span class="emoji">💰</span>
        <h2>Spese registrate</h2>
        <p class="numero">{{ numero_spese }}</p>
    </article>
    <article class="scheda">
        <span class="emoji">📊</span>
        <h2>Totale spese</h2>
        <p class="numero">CHF {{ '%.2f'|format(totale) }}</p>
    </article>
</section>
{% endblock %}
