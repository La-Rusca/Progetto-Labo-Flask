{% extends "base.html" %}
{% block contenuto %}
<section class="pagina">
    <h1>Login</h1>
    <form method="post" class="modulo">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Nome utente <input name="username" required></label>
        <label>Password <input type="password" name="password" required></label>
        <button class="pulsante" type="submit">Accedi</button>
    </form>
    <p>Non hai un account? <a href="{{ url_for('auth.registrazione') }}">Registrati</a></p>
</section>
{% endblock %}
