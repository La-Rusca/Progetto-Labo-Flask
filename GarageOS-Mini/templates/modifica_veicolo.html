{% extends "base.html" %}
{% block contenuto %}
<section class="pagina">
    <h1>Modifica veicolo</h1>
    <form method="post" class="modulo">
        <label>Marca <input name="marca" maxlength="50" value="{{ veicolo.marca }}" required></label>
        <label>Modello <input name="modello" maxlength="50" value="{{ veicolo.modello }}" required></label>
        <label>Anno <input name="anno" type="number" min="1900" max="2100" value="{{ veicolo.anno }}" required></label>
        <button class="pulsante" type="submit">Salva modifiche</button>
    </form>
    <p><a href="{{ url_for('veicoli') }}">Torna ai veicoli</a></p>
</section>
{% endblock %}
